server:
  port: 8080

spring:
  application:
    name: approval-app
  datasource:
    # EC2에서 실행할 때 환경변수로 주입됨 (Terraform user-data가 /etc/approval-app.env에 기록)
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Spring Boot 기본값(10)을 그대로 명시. 서버 1대당 DB 연결 최대 10개
      maximum-pool-size: 10
      # 커넥션을 기다리는 최대 시간. 넘으면 500 에러
      connection-timeout: 10000
